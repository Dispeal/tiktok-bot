# Copy this file to config.yaml and fill it in.
# Secrets (bot tokens, API keys, proxy) go in environment variables, not here.

poll_interval_minutes: 15     # how often every account is checked (randomized +-15%)
videos_per_check: 5           # how many of each account's latest videos to look at
max_concurrent_checks: 3      # accounts checked at the same time; keep low to avoid TikTok blocks
post_existing_on_first_run: false   # false = only post videos uploaded after an account is added

caption:
  enabled: true
  model: claude-opus-5-5      # claude-haiku-4-5 is cheaper if cost matters
  effort: low

clients:
  annual:
    bot_token_env: CLIENT_A_BOT_TOKEN   # @AnnualLMB_Bot
    admins: [8304806608]
    credit_clipper: true
    footer: ""
    style: |
      Third-person entertainment-news tone, like a celebrity/fashion news account.
      Open with a short scene-setter ("Tonight,", "Earlier today,", "Live on stream,").
      Tag people with their @handles when the material tells you who they are.
      Work one or two relevant hashtags into the sentence itself instead of piling them at the end.
      Two sentences, roughly 40-70 words. No emojis.
    examples:
      - >-
        Tonight, @thv took a turn in the audience as he watched @gracieabrams and @dojacat
        perform at #VogueWorld: Hollywood. No stranger to a fashion show either, the
        @bts.bighitofficial star dressed in a look that could have easily appeared on the runway.
    channels:
      main:
        chat_id: -1004397844400         # LMB ANNUAL KICK
        accounts: []                    # add TikTok usernames here, or DM the bot: /add @username
